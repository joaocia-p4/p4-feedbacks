<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sistema de Feedbacks · Método P4</title>
<link rel="icon" type="image/png" href="assets/p4-mark.png" />
<link rel="apple-touch-icon" href="assets/p4-mark.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root{
  /* MARCA — verde vibrante protagonista + tinta legível p/ texto (AA) */
  --green:#22C55E; --accent:#22C55E; --accent-rgb:34,197,94;
  --brand:#22C55E; --brand-strong:#16A34A; --brand-glow:#4ADE80; --teal:#0EA5A0;
  --brand-ink:#15803D; --green-ink:#15803D;               /* texto verde AA (~4.9:1) */
  --grad:linear-gradient(135deg,#34D399 0%,#22C55E 45%,#16A34A 100%);
  --grad-teal:linear-gradient(135deg,#34D399 0%,#16A34A 55%,#0EA5A0 100%);
  --grad-cta:linear-gradient(135deg,#15803D 0%,#0C6A32 100%); /* deep green — texto branco ~5:1 AA (superficies COM texto) */
  /* SUPERFÍCIES — light-first, off-white quente com leve tom verde */
  --stage:#F4F7F3; --paper:#FFFFFF; --surface:#FFFFFF; --surface-2:#F7FAF6;
  --glass:rgba(255,255,255,.72);
  /* TINTA / LINHAS */
  --ink:#0E1A13; --ink-2:#4E5D54; --muted:#8A978C; --line:#E7ECE6; --line-2:#EFF3EE; --line-hover:#cfd8cf;
  /* SEMÂNTICOS */
  --red:#E5484D; --red-ink:#C4353A; --amber:#F59E0B; --amber-ink:#B45309; --blue:#3B82F6; --blue-ink:#1D4ED8; --violet:#7C5CFC; --violet-ink:#5B3FD8;
  /* CHROME ESCURO (login aside / brilhos) */
  --panel:#0E1A13; --panel-2:#16241B; --panel-line:#24352B; --panel-txt:#E8F0EA; --panel-mut:#8FA396;
  /* RAIOS / SOMBRAS / MOTION */
  --r-card:18px; --r-md:12px; --r-sm:9px; --r-pill:999px;
  --sh-1:0 1px 2px rgba(14,26,19,.05),0 1px 3px rgba(14,26,19,.04);
  --sh-2:0 12px 34px -16px rgba(16,163,74,.28),0 4px 12px -8px rgba(14,26,19,.10);
  --sh-glow:0 18px 50px -20px rgba(34,197,94,.55);
  --side-w:248px; --ease:cubic-bezier(.4,.14,.3,1);
  /* MARKETPLACES (mantidos) */
  --ml:#FFE600; --ml-ink:#8A7400; --shopee:#EE4D2D; --magalu:#0E89FF; --amazon:#232F3E; --tiktok:#FE2858;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Sora',system-ui,sans-serif;
  background:var(--stage);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
#root{height:100vh;overflow:hidden}
.mono{font-family:'JetBrains Mono',monospace}
/* foco visível por teclado — o offset desenha o anel sobre a superfície ao redor (verde ok em fundo claro e escuro) */
button:focus-visible,a:focus-visible,select:focus-visible,[role=button]:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ============================================================= LOGIN */
.login{display:flex;min-height:100vh;background:#0b1410;color:var(--panel-txt)}

/* Painel da marca (esquerda) */
.login-aside{
  flex:0 0 48%;max-width:680px;position:relative;overflow:hidden;
  display:flex;flex-direction:column;justify-content:space-between;padding:56px 60px;
  background:
    radial-gradient(820px 620px at 14% 2%, rgba(52,211,153,.28), transparent 58%),
    radial-gradient(680px 620px at 118% 116%, rgba(14,165,160,.24), transparent 54%),
    linear-gradient(158deg,#0f2019,#0b1410 72%);
  border-right:1px solid rgba(255,255,255,.06);
}
.la-grid{
  position:absolute;inset:0;opacity:.5;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:46px 46px;mask-image:radial-gradient(760px 560px at 24% 14%,#000,transparent 78%);
}
.la-blob{
  position:absolute;left:-120px;top:30%;width:560px;height:560px;border-radius:50%;pointer-events:none;filter:blur(30px);
  background:radial-gradient(circle, rgba(var(--accent-rgb),.34), transparent 62%);
  animation:laGlow 9s ease-in-out infinite;
}
.la-top,.la-mid,.la-foot{position:relative;z-index:1}
.la-top{display:flex;align-items:center;gap:12px}
.la-top img{width:42px;height:42px;object-fit:contain;filter:drop-shadow(0 0 16px rgba(var(--accent-rgb),.45))}
.la-brand{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--brand-glow);font-weight:700}
.la-mid{max-width:440px}
.la-tag{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--panel-mut);margin-bottom:14px}
.la-head{font-size:32px;line-height:1.16;font-weight:800;letter-spacing:-.025em;color:#fff;margin:0 0 28px;max-width:16ch}
.la-head em{font-style:normal;background:linear-gradient(120deg,var(--brand-glow),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent}
.la-feats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:13px}
.la-feats li{display:flex;align-items:center;gap:12px;font-size:14.5px;font-weight:500;color:#d6e5dd}
.la-feats .fi{width:26px;height:26px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(52,211,153,.16);color:var(--brand-glow);border:1px solid rgba(52,211,153,.24)}
.la-foot{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--panel-mut)}

/* Área do formulário (direita) */
.login-main{
  flex:1;display:flex;align-items:center;justify-content:center;padding:32px 24px;
  background:radial-gradient(760px 540px at 82% -8%, rgba(var(--accent-rgb),.10), transparent 60%),#0b1410;
}
.login-card .login-brand{display:none}

@media (max-width:880px){
  .login-aside{display:none}
  .login-card .login-brand{display:flex}
}
.login-card{
  position:relative;z-index:1;width:100%;max-width:410px;
  background:#fff;color:var(--ink);border-radius:22px;
  padding:38px 36px 30px;box-shadow:0 40px 90px -30px rgba(0,0,0,.6);
}
.login-brand{display:flex;align-items:center;gap:13px;margin-bottom:26px}
.login-brand img{width:46px;height:46px;object-fit:contain;box-sizing:border-box;padding:9px;border-radius:13px;background:var(--grad);box-shadow:var(--sh-glow)}
.login-brand .lb-tag{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--brand-ink);margin-bottom:4px}
.login-brand .lb-name{font-size:17px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.login h1{font-size:24px;font-weight:800;color:var(--ink);letter-spacing:-.02em;margin-bottom:5px}
.login .sub{font-size:12.5px;color:var(--muted);font-weight:500;margin-bottom:24px}

.field{display:flex;flex-direction:column;gap:7px;margin-bottom:15px}
.field-label{font-size:12px;font-weight:600;color:var(--ink-2)}
.field-in{display:flex;align-items:center;background:var(--surface-2);border:1.5px solid var(--line);border-radius:var(--r-md);overflow:hidden;transition:.15s var(--ease)}
.field-in:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px rgba(var(--accent-rgb),.14);background:#fff}
.field-in input{flex:1;background:transparent;border:0;outline:none;color:var(--ink);font-family:'Sora';font-size:14px;font-weight:500;padding:12px 13px;width:100%}
.field-in input::placeholder{color:var(--muted)}
.field-in .ic{padding:0 0 0 13px;color:var(--muted);flex:none;display:flex}
.field-in .pw-eye{padding:0 13px;color:var(--muted);background:none;border:0;cursor:pointer;display:flex}
.field-in .pw-eye:hover{color:var(--ink)}

.login-row{display:flex;justify-content:space-between;align-items:center;margin:-2px 0 18px}
.login-check{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12.5px;color:var(--ink-2);font-weight:500;user-select:none}
.login-check input{display:none}
.login-check .box{width:17px;height:17px;border-radius:6px;border:1.5px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;transition:.14s}
.login-check input:checked + .box{background:var(--grad);border-color:transparent}
.login-check input:checked + .box::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);margin-top:-2px}
.link{color:var(--brand-ink);font-size:12.5px;font-weight:600;text-decoration:none;cursor:pointer}
.link:hover{text-decoration:underline}

.login-card .btn-primary{width:100%;justify-content:center;font-size:15px;padding:14px;border-radius:var(--r-md);margin-top:2px}
.login-card .btn-primary:active{transform:translateY(1px)}
.login-card .btn-primary:disabled{opacity:.65;cursor:not-allowed;transform:none;filter:none}

.login-foot{margin-top:22px;text-align:center;font-size:11.5px;color:var(--muted);font-weight:500;line-height:1.7}
.login-foot .mono{font-size:10px;letter-spacing:.04em}
.login-err{background:rgba(229,72,77,.08);border:1px solid rgba(229,72,77,.35);color:var(--red-ink);font-size:11.5px;font-weight:500;padding:9px 12px;border-radius:8px;margin-bottom:14px;display:flex;gap:8px;align-items:center;animation:laUp .3s ease both}
.login-err svg{flex:none;color:var(--red)}

/* animações da tela de login (entrada em cascata + brilho que respira) */
@keyframes laUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes laGlow{0%,100%{transform:translate(0,0) scale(1);opacity:.6}50%{transform:translate(46px,-28px) scale(1.18);opacity:1}}
@keyframes laLogo{0%,100%{filter:drop-shadow(0 0 14px rgba(var(--accent-rgb),.35))}50%{filter:drop-shadow(0 0 22px rgba(var(--accent-rgb),.6))}}
.la-top{animation:laUp .55s .05s ease both}
.la-top img{animation:laLogo 5s ease-in-out infinite}
.la-tag{animation:laUp .55s .16s ease both}
.la-head{animation:laUp .6s .24s ease both}
.la-feats li{animation:laUp .5s ease both}
.la-feats li:nth-child(1){animation-delay:.42s}
.la-feats li:nth-child(2){animation-delay:.52s}
.la-feats li:nth-child(3){animation-delay:.62s}
.la-foot{animation:laUp .55s .78s ease both}
.login-card{animation:laUp .6s .12s ease both}

/* ============================================================= AURORA / GLOW helpers */
.aurora{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.aurora::before,.aurora::after{content:"";position:absolute;border-radius:50%;filter:blur(60px);opacity:.85}
.aurora::before{width:520px;height:520px;left:-120px;top:-140px;background:radial-gradient(circle,rgba(52,211,153,.45),transparent 66%);animation:auroraFloat 12s var(--ease) infinite alternate}
.aurora::after{width:500px;height:500px;right:-140px;bottom:-160px;background:radial-gradient(circle,rgba(14,165,160,.34),transparent 66%);animation:auroraFloat 14s var(--ease) infinite alternate-reverse}
@keyframes auroraFloat{to{transform:translate(40px,30px) scale(1.12)}}

/* ============================================================= APP SHELL (clients / history) */
.shell{height:100vh;display:flex;flex-direction:column;background:var(--stage);padding-left:var(--side-w)}

/* ---- menu lateral (sidebar) — vidro claro + brilho aurora no topo ---- */
.app-side{position:fixed;left:0;top:0;bottom:0;width:var(--side-w);background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40;overflow:hidden}
.app-side::before{content:"";position:absolute;top:-80px;left:-40px;width:260px;height:220px;border-radius:50%;filter:blur(50px);background:radial-gradient(circle,rgba(52,211,153,.2),transparent 66%);pointer-events:none}
.as-brand{display:flex;align-items:center;gap:11px;height:64px;padding:0 18px;border-bottom:1px solid var(--line);flex:none;position:relative;z-index:1}
.as-brand img{width:30px;height:30px;object-fit:contain;flex:none;background:var(--grad);border-radius:var(--r-sm);padding:5px;box-sizing:border-box;box-shadow:0 6px 16px -8px rgba(16,163,74,.7)}
.as-brand b{font-size:14px;font-weight:700;color:var(--ink);letter-spacing:-.01em;display:block;line-height:1.1}
.as-brand .mono{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--brand-ink);display:block;margin-top:2px}
.as-nav{flex:1;overflow-y:auto;padding:12px 12px 18px;display:flex;flex-direction:column;gap:3px;position:relative;z-index:1}
.as-sec{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:16px 12px 7px}
.as-sec:first-child{padding-top:6px}
.as-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;cursor:pointer;color:var(--ink-2);font-family:'Sora';font-weight:600;font-size:13.5px;padding:10px 12px;border-radius:var(--r-md);transition:.14s var(--ease);text-decoration:none}
.as-item svg{flex:none;color:var(--muted);transition:.14s}
.as-item span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.as-item .ext{flex:none;opacity:.45}
.as-item:hover{background:var(--surface-2);color:var(--ink)}
.as-item:hover svg{color:var(--ink)}
.as-item.on{background:linear-gradient(100deg,rgba(34,197,94,.14),rgba(14,165,160,.08));color:var(--brand-ink)}
.as-item.on svg{color:var(--brand-ink)}
.as-foot{flex:none;border-top:1px solid var(--line);padding:13px 18px;display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;color:var(--muted);position:relative;z-index:1}
.as-dot{width:8px;height:8px;border-radius:50%;flex:none}

/* título da página no topbar */
.tb-title{font-size:15px;font-weight:700;color:var(--ink);letter-spacing:-.01em}

/* responsivo: o menu vira um trilho de ícones */
@media (max-width:1000px){
  :root{--side-w:66px}
  .as-brand{justify-content:center;padding:0;gap:0}
  .as-brand div{display:none}
  .as-sec{text-align:center;padding:14px 0 6px;font-size:0;letter-spacing:0}
  .as-item{justify-content:center;padding:11px 0;gap:0}
  .as-item span,.as-item .ext{display:none}
  .as-foot{justify-content:center;padding:13px 0;font-size:0;gap:0}
}

/* ---- página de configurações ---- */
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;align-items:start}
.set-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--sh-1)}
.set-h{display:flex;align-items:center;gap:11px;margin-bottom:16px}
.set-h b{font-size:14.5px;font-weight:700}
.set-ic{width:34px;height:34px;border-radius:11px;background:rgba(var(--accent-rgb),.13);color:var(--brand-ink);display:flex;align-items:center;justify-content:center;flex:none}
.set-acct{display:flex;align-items:center;gap:12px}
.set-av{width:42px;height:42px;border-radius:11px;background:var(--grad-cta);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none;font-family:'JetBrains Mono',monospace}
.set-acct-nm{font-size:14px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-acct-em{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--line-2)}
.set-row:first-of-type{border-top:0;padding-top:4px}
.set-row-t{font-size:13px;font-weight:600}
.set-row-s{font-size:11.5px;color:var(--muted);font-weight:500;margin-top:3px;max-width:280px;line-height:1.45}
.set-accs{display:flex;gap:9px;flex:none}
.set-acc{width:28px;height:28px;border-radius:8px;border:0;cursor:pointer;transition:.13s;padding:0}
.set-acc:hover{transform:scale(1.08)}
.set-acc.on{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink)}
.set-tag{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.02em;text-transform:lowercase;color:var(--muted);background:var(--surface-2);padding:5px 10px;border-radius:7px;flex:none}
.set-about{display:flex;flex-direction:column}
.set-kv{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line-2);font-size:13px}
.set-kv:first-child{border-top:0}
.set-kv span{color:var(--muted);font-weight:500}
.set-kv b{font-weight:600}
.set-card .link{color:var(--brand-ink);cursor:pointer;font-weight:600;text-decoration:none}
.set-card .link:hover{text-decoration:underline}

/* ---- import dropzone ---- */
.dropzone{border:2px dashed #c5d0c5;border-radius:var(--r-card);background:var(--surface-2);padding:32px 24px;text-align:center;transition:.16s var(--ease)}
.dropzone:hover{border-color:var(--brand);background:rgba(var(--accent-rgb),.05)}
.dz-ic{width:56px;height:56px;border-radius:16px;background:var(--grad-cta);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:var(--sh-glow)}
.topbar{
  flex:none;display:flex;align-items:center;gap:18px;height:64px;padding:0 26px;
  background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
}
.tb-brand{display:flex;align-items:center;gap:11px;flex:none}
.tb-brand img{width:30px;height:30px;object-fit:contain;background:var(--grad);border-radius:var(--r-sm);padding:5px;box-sizing:border-box;box-shadow:0 6px 16px -8px rgba(16,163,74,.7)}
.tb-brand b{font-size:14.5px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.tb-brand .mono{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--brand-ink);display:block;margin-top:1px}
.tb-spacer{flex:1}
.tb-back{display:flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;color:var(--ink-2);font-family:'Sora';font-weight:600;font-size:13px;padding:8px 10px;border-radius:var(--r-md);transition:.14s var(--ease)}
.tb-back:hover{color:var(--ink);background:var(--surface-2)}

.tb-user{display:flex;align-items:center;gap:11px;flex:none;cursor:pointer;padding:6px 8px 6px 6px;border-radius:var(--r-md);transition:.14s var(--ease);position:relative}
.tb-user:hover{background:var(--surface-2)}
.avatar{width:34px;height:34px;border-radius:var(--r-sm);background:var(--grad-cta);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex:none;font-family:'JetBrains Mono',monospace}
.tb-user .nm{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.25}
.tb-user .rl{font-size:10px;color:var(--muted);font-weight:500;text-transform:capitalize}
.tb-menu{position:absolute;top:56px;right:0;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:6px;min-width:180px;box-shadow:var(--sh-2);z-index:30}
.tb-menu button{width:100%;display:flex;align-items:center;gap:9px;background:none;border:0;cursor:pointer;color:var(--ink-2);font-family:'Sora';font-weight:500;font-size:12.5px;padding:9px 10px;border-radius:7px;text-align:left}
.tb-menu button:hover{background:var(--surface-2);color:var(--ink)}
.tb-menu button.danger{color:var(--red-ink)}
.tb-menu button.danger:hover{background:rgba(229,72,77,.08)}
.tb-menu .sep{height:1px;background:var(--line);margin:5px 4px}

.role-pill{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:3px 7px;border-radius:6px;background:rgba(34,197,94,.15);color:var(--brand-ink)}
.role-pill.analista{background:rgba(140,154,163,.18);color:var(--muted)}
.role-pill.cs{background:rgba(59,130,246,.16);color:var(--blue)}
.dash-print-head{display:none}
@media print{
  @page{margin:14mm}
  :root{--side-w:0px}
  html,body{background:#fff !important}
  *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}
  .app-side,.topbar,.twk-panel,[data-omelette-chrome],.toast,.no-print,.toolbar,.filters,.filterbar{display:none !important}
  .page{background:#fff !important;padding:0 !important}
  .page-inner{max-width:none !important;padding:0 !important}
  .dash-print-head{display:flex !important;align-items:center;gap:12px;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid #1C242E}
  .dash-print-head img{width:34px}
  .dash-no-break{break-inside:avoid;page-break-inside:avoid}
  h1{font-size:20px}
}

/* page scroller */
.page{flex:1;overflow-y:auto;overflow-x:hidden}
.page-inner{max-width:1280px;margin:0 auto;padding:30px 30px 60px}

/* ---- clients header / toolbar ---- */
.ch-top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.ch-eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--green-ink);margin-bottom:8px}
.ch-top h1{font-size:25px;font-weight:700;letter-spacing:-.02em}
.ch-top .ch-sub{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:4px}
.ch-sub b{color:var(--ink);font-weight:700}

/* stats inline no header (redesign clientes) */
.ch-stats{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.ch-stats .sep{color:#c4ccc4}
.stat{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink)}
.stat .n{font-family:'JetBrains Mono',monospace;font-weight:700}
.stat .dt{width:7px;height:7px;border-radius:50%;background:#9aa39d}
.stat.ok .dt{background:var(--green)}
.stat.late{color:var(--red)}.stat.late .dt{background:var(--red)}
.stat.send{color:var(--green-ink)}.stat.send .dt{background:var(--green-ink)}
.stat.closed{color:var(--muted)}
.ch-actions{display:flex;gap:8px;align-items:center}

.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:0 14px;flex:1;min-width:230px;max-width:420px;transition:.15s var(--ease)}
.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px rgba(34,197,94,.14)}
.search svg{color:var(--muted);flex:none}
.search input{flex:1;border:0;outline:none;background:transparent;font-family:'Sora';font-size:13.5px;font-weight:500;color:var(--ink);padding:11px 0}
.search input::placeholder{color:#9aa39d}

/* filtro dropdown (analista) */
.filter-select{position:relative;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:0 30px 0 12px;transition:.15s var(--ease);flex:none}
.filter-select:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px rgba(34,197,94,.14)}
.filter-select.on{border-color:rgba(34,197,94,.55)}
.filter-select > svg{color:var(--muted);flex:none}
.filter-select.on > svg{color:var(--brand-ink)}
.filter-select select{appearance:none;border:0;outline:none;background:transparent;font-family:'Sora';font-size:13px;font-weight:600;color:var(--ink);padding:10px 0;cursor:pointer;max-width:180px}
.filter-select.on select{color:var(--brand-ink)}
.filter-select::after{content:"▾";position:absolute;right:12px;color:var(--muted);font-size:11px;pointer-events:none}

.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{appearance:none;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-family:'Sora';font-size:12px;font-weight:600;padding:9px 14px;border-radius:var(--r-pill);transition:.14s var(--ease);display:inline-flex;align-items:center;gap:7px}
.chip:hover{border-color:var(--line-hover);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .dot{width:7px;height:7px;border-radius:50%}

/* ---- due / send-date filter ---- */
.due-toggle{appearance:none;cursor:pointer;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-family:'Sora';font-weight:600;font-size:13px;padding:9px 15px;border-radius:var(--r-md);transition:.14s var(--ease)}
.due-toggle svg{color:var(--brand-ink)}
.due-toggle:hover{border-color:var(--line-hover)}
.due-toggle.on{background:var(--ink);border-color:var(--ink);color:#fff}
.due-toggle.on svg{color:var(--brand)}
.due-toggle .cnt{font-family:'JetBrains Mono',monospace;font-weight:700;background:rgba(34,197,94,.16);color:var(--brand-ink);padding:2px 7px;border-radius:6px;font-size:11px}
.due-toggle.on .cnt{background:rgba(34,197,94,.22);color:var(--brand)}

/* linha de chips de status + marketplace (com contagem) */
.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.filters .div,.fb-row .div{width:1px;height:22px;background:var(--line);margin:0 3px;flex:none}
.chip .c{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;opacity:.7}

/* ── barra única de filtros: busca + status + marketplaces num cartão ── */
.filterbar{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:13px 15px;margin-bottom:22px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--sh-1)}
.fb-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fb-sep{height:1px;background:var(--line-2);margin:0 -15px}
.filterbar .search,.filterbar .due-toggle,.filterbar .due-date,.filterbar .filter-select{background:var(--surface-2)}
.filterbar .due-toggle.on{background:var(--ink)}
.filterbar .chip{background:var(--surface-2);border-color:transparent}
.filterbar .chip:hover{background:var(--surface);border-color:var(--line-hover)}
.filterbar .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.fb-clear{margin-left:auto;appearance:none;border:0;background:none;cursor:pointer;color:var(--muted);font-family:'Sora';font-weight:600;font-size:12px;padding:8px 10px;border-radius:var(--r-sm);display:inline-flex;align-items:center;gap:6px;transition:.14s var(--ease);flex:none}
.fb-clear:hover{color:var(--red-ink);background:rgba(229,72,77,.08)}
/* chips de status na cor da tag correspondente (mesma paleta de .status-tag) */
.chip.st-ok .dot{background:var(--brand)}
.chip.st-today .dot{background:var(--blue)}
.chip.st-late .dot{background:var(--red)}
.chip.st-paused .dot{background:var(--amber)}
.chip.st-onboarding .dot{background:var(--violet)}
.chip.st-closed .dot{background:var(--muted)}
.filterbar .chip.st-ok.on{background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.5);color:var(--brand-ink)}
.filterbar .chip.st-today.on{background:rgba(59,130,246,.13);border-color:rgba(59,130,246,.45);color:var(--blue-ink)}
.filterbar .chip.st-late.on{background:rgba(229,72,77,.12);border-color:rgba(229,72,77,.45);color:var(--red-ink)}
.filterbar .chip.st-paused.on{background:rgba(245,158,11,.15);border-color:rgba(245,158,11,.5);color:var(--amber-ink)}
.filterbar .chip.st-onboarding.on{background:rgba(124,92,252,.14);border-color:rgba(124,92,252,.5);color:var(--violet-ink)}
.filterbar .chip.st-closed.on{background:rgba(138,151,140,.16);border-color:rgba(138,151,140,.55);color:var(--ink-2)}
.chip.on .c{opacity:.85}

/* ── seletor de analista (popover custom no lugar do <select> nativo) ── */
.an-pick{position:relative;flex:none}
.an-btn{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:9px 12px;font-family:'Sora';font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;transition:.15s var(--ease);max-width:230px}
.filterbar .an-btn{background:var(--surface-2)}
.an-btn:hover{border-color:var(--line-hover)}
.an-pick.open .an-btn{border-color:var(--brand);box-shadow:0 0 0 4px rgba(34,197,94,.14)}
.an-pick.on .an-btn{border-color:rgba(34,197,94,.55);color:var(--brand-ink)}
.an-btn > svg:first-child{color:var(--muted);flex:none}
.an-pick.on .an-btn > svg:first-child{color:var(--brand-ink)}
.an-lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.an-chev{color:var(--muted);flex:none;transition:transform .16s ease}
.an-pick.open .an-chev{transform:rotate(180deg)}
.an-menu{position:absolute;top:calc(100% + 6px);left:0;z-index:30;min-width:236px;max-height:300px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-2);padding:6px;animation:anPop .14s ease}
@keyframes anPop{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.an-opt{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;cursor:pointer;padding:8px 10px;border-radius:9px;font-family:'Sora';font-size:13px;font-weight:600;color:var(--ink);text-align:left;transition:background .1s}
.an-opt:hover{background:var(--surface-2)}
.an-opt.sel{background:rgba(34,197,94,.12);color:var(--brand-ink)}
.an-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.an-av{width:24px;height:24px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;color:var(--ink-2);flex:none}
.an-av.all{color:var(--muted)}
.an-opt.sel .an-av{background:rgba(34,197,94,.16);border-color:rgba(34,197,94,.4);color:var(--brand-ink)}
.an-n{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;color:var(--muted);padding-left:10px}
.an-opt.sel .an-n{color:var(--brand-ink)}
.due-date{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:0 12px;color:var(--muted);transition:.14s var(--ease)}
.due-date:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px rgba(34,197,94,.14)}
.due-date input{border:0;outline:none;background:transparent;font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:500;color:var(--ink);padding:10px 0}
.due-date input::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.55}
.due-info{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--brand-ink);background:rgba(34,197,94,.12);padding:6px 11px;border-radius:8px;font-weight:600}

.btn-accent,.btn-primary{appearance:none;cursor:pointer;border:0;display:inline-flex;align-items:center;gap:8px;font-family:'Sora';font-weight:700;font-size:13px;padding:11px 16px;border-radius:var(--r-md);text-decoration:none;background:var(--grad-cta);color:#fff;box-shadow:0 10px 22px -12px rgba(16,163,74,.8);transition:.15s var(--ease)}
.btn-accent:hover,.btn-primary:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn-line,.btn-ghost{appearance:none;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:'Sora';font-weight:600;font-size:13px;padding:10px 15px;border-radius:var(--r-md);display:inline-flex;align-items:center;gap:8px;transition:.15s var(--ease);text-decoration:none}
.btn-line:hover,.btn-ghost:hover{border-color:var(--line-hover);background:var(--surface-2)}
.btn-line.danger-line{color:var(--red-ink)}
.btn-line.danger-line:hover{border-color:var(--red-ink);background:rgba(196,53,58,.06)}
.btn-dark{appearance:none;cursor:pointer;border:0;background:var(--ink);color:#fff;font-family:'Sora';font-weight:600;font-size:13px;padding:11px 16px;border-radius:var(--r-md);display:inline-flex;align-items:center;gap:8px;transition:.15s var(--ease);text-decoration:none}
.btn-dark:hover{background:#28323d}

/* menu "⋯" (ações em massa) */
.km-btn,.icon-btn{width:40px;height:40px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:.14s var(--ease);flex:none}
.km-btn:hover,.km-btn.on,.icon-btn:hover{border-color:var(--brand);color:var(--brand-ink);background:rgba(34,197,94,.06)}
.km-menu{position:absolute;top:48px;right:0;z-index:40;background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:6px;min-width:226px;box-shadow:0 18px 44px -16px rgba(28,36,46,.28);animation:kmin .14s ease}
@keyframes kmin{from{opacity:0;transform:translateY(-6px)}}
.km-item{width:100%;display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:8px;border:0;background:none;cursor:pointer;font-family:'Sora';font-weight:600;font-size:13px;color:var(--ink);text-align:left;transition:.12s}
.km-item:hover{background:rgba(var(--accent-rgb),.08);color:var(--green-ink)}
.km-item svg{flex:none;color:var(--muted)}
.km-item:hover svg{color:var(--green-ink)}

/* ---- client cards grid ---- */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.ccard{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:19px;cursor:pointer;
  transition:.18s var(--ease);display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;box-shadow:var(--sh-1);
}
.ccard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;transition:.18s var(--ease)}
.ccard.late::before{background:var(--red)}
.ccard.is-today::before{background:var(--blue)}
.ccard:hover{border-color:rgba(34,197,94,.5);box-shadow:var(--sh-2);transform:translateY(-3px)}
.ccard.is-closed{opacity:.62}
.ccard.is-closed:hover{opacity:.9}
.ccard.is-dim{opacity:.74}
.ccard.is-dim:hover{opacity:1}
.cc-head{display:flex;align-items:flex-start;gap:11px}
.cc-head .nm{flex:1;min-width:0}
.cc-head .loja{font-size:16px;font-weight:700;letter-spacing:-.01em;line-height:1.2;text-wrap:balance}
.cc-head .an{font-size:11.5px;color:var(--muted);font-weight:500;margin-top:3px;display:flex;align-items:center;gap:6px}
.mk-badge{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.04em;padding:4px 8px;border-radius:7px;flex:none}
.status-tag,.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:4px 10px 4px 8px;border-radius:var(--r-pill);flex:none}
.status-tag .d,.tag .d{width:7px;height:7px;border-radius:50%}
.status-tag.ok,.tag.ok{background:rgba(34,197,94,.13);color:var(--brand-ink)}
.status-tag.ok .d,.tag.ok .d{background:var(--brand)}
.status-tag.late,.tag.late{background:rgba(229,72,77,.12);color:var(--red-ink)}
.status-tag.late .d,.tag.late .d{background:var(--red)}
.status-tag.closed,.tag.closed{background:rgba(138,151,140,.15);color:var(--muted)}
.status-tag.closed .d,.tag.closed .d{background:var(--muted)}
.status-tag.today,.tag.today{background:rgba(59,130,246,.13);color:var(--blue-ink)}
.status-tag.today .d,.tag.today .d{background:var(--blue)}
.status-tag.paused,.tag.paused{background:rgba(245,158,11,.15);color:var(--amber-ink)}
.status-tag.paused .d,.tag.paused .d{background:var(--amber)}
.status-tag.onboarding,.tag.onboarding{background:rgba(124,92,252,.14);color:var(--violet-ink)}
.status-tag.onboarding .d,.tag.onboarding .d{background:var(--violet)}

.cc-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:2px}
.cc-foot .lr{font-size:11px;color:var(--muted);font-weight:500;text-align:right}
.cc-foot .lr b{color:var(--ink);font-weight:600;display:block;font-family:'JetBrains Mono',monospace;font-size:11.5px;margin-top:1px}

/* ---- bloco de reputação (Mercado Livre) no card ---- */
.rep{display:flex;align-items:center;gap:12px;padding:13px;border-radius:13px;background:#f7f9f7;border:1px solid var(--line);margin-top:auto}
.rep-therm{display:flex;align-items:flex-end;gap:3px;flex:none}
.rep-seg{width:8px;height:15px;border-radius:3px;opacity:.28;transition:.15s}
.rep-seg.on{height:24px;opacity:1;box-shadow:0 3px 8px -3px currentColor}
.rep-txt{min-width:0;flex:1}
.rep-txt .lvl{font-size:13.5px;font-weight:700;line-height:1.15}
.rep-txt .medal{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:3px;display:flex;align-items:center;gap:5px}
.rep-txt .medal svg{color:var(--amber)}
.rep.muted{background:#f4f5f4;border-style:dashed}
.rep-ic{width:34px;height:34px;border-radius:9px;background:#e9ece9;color:var(--muted);display:flex;align-items:center;justify-content:center;flex:none}
.rep.muted .lvl{font-size:12.5px;font-weight:600}
.rep.muted .medal{text-transform:none;letter-spacing:0;font-family:'Sora';font-size:11px}
.rep-connect{appearance:none;border:0;background:none;cursor:pointer;margin-left:auto;font-family:'Sora';font-size:11.5px;font-weight:700;color:var(--green-ink);display:inline-flex;align-items:center;gap:5px;flex:none;padding:4px}
.rep-connect:hover{text-decoration:underline}
/* skeleton de carregamento */
.rep .sk{background:linear-gradient(90deg,#e9ece9 25%,#f7f9f7 37%,#e9ece9 63%);background-size:400% 100%;animation:repsk 1.2s ease infinite;border-radius:6px}
@keyframes repsk{0%{background-position:100% 0}100%{background-position:0 0}}

.add-card{border:1.5px dashed #c5d0c5;background:transparent;border-radius:var(--r-card);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;min-height:230px;color:var(--muted);font-weight:600;font-size:13.5px;transition:.16s var(--ease)}
.add-card:hover{border-color:var(--brand);color:var(--brand-ink);background:rgba(34,197,94,.05)}
.add-card .plus{width:46px;height:46px;border-radius:14px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-glow)}
.add-card:hover .plus{background:var(--accent);color:#0d1410}

.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;font-weight:700;margin-bottom:6px}

/* ---- card genérico (átomo reutilizável) ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--sh-1)}

/* ---- tabela genérica (átomo reutilizável) ---- */
.tbl{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--sh-1)}
.tr{display:grid;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line-2);transition:.12s var(--ease)}
.tr:last-child{border-bottom:0}
.tr:hover{background:var(--surface-2)}
.tr.head{background:var(--surface-2)}
.tr.head span{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-family:'JetBrains Mono',monospace;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.per{font-weight:600;font-size:13px}
.per .mono{font-size:10px;color:var(--muted);display:block;margin-top:2px}

/* ============================================================= HISTORY */
.hh{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:24px}
.hh-id .crumb{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.hh-id h1{font-size:28px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.hh-id .meta{display:flex;align-items:center;gap:16px;margin-top:11px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:500}
.hh-id .meta b{color:var(--ink);font-weight:600}
.hh-actions{display:flex;gap:10px;flex-wrap:wrap}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:16px 17px;box-shadow:var(--sh-1);position:relative;overflow:hidden;transition:.18s var(--ease)}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.kpi.hero{background:var(--grad-cta);color:#fff;border:0}
.kpi.hero .k,.kpi.hero .trend{color:#fff}
.kpi.hero .v{color:#fff}
.kpi.hero .v small{color:rgba(255,255,255,.9)}
.kpi.hero .trend.up,.kpi.hero .trend.down{color:#fff}
.kpi .k{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.kpi .v{font-size:25px;font-weight:700;font-family:'JetBrains Mono',monospace;letter-spacing:-.02em;line-height:1}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:600}
.kpi .trend{font-size:11px;font-weight:600;margin-top:7px;display:flex;align-items:center;gap:5px}
.kpi .trend.up{color:var(--green-ink)}
.kpi .trend.down{color:var(--red)}

.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sec-head h2{font-size:15px;font-weight:700}
.sec-head .mono{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sec-head::after{content:"";flex:1;height:1px;background:var(--line)}

/* charts CS */
.kpi-mini{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--sh-1)}
.kpi-mini .k{font-family:'JetBrains Mono';font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.kpi-mini .v{font-size:24px;font-weight:800;line-height:1}
.kpi-mini .f{font-size:11px;color:var(--muted);margin-top:6px}
.hbar-lab{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
.hbar{height:10px;background:var(--stage);border-radius:6px;overflow:hidden}
.hbar>span{display:block;height:100%;background:var(--grad)}

.rtable{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--sh-1)}
.rrow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.1fr) minmax(0,.85fr) minmax(0,.85fr) minmax(0,.85fr) minmax(0,1fr) minmax(0,1.05fr) 150px;gap:14px;align-items:center;padding:15px 20px;border-bottom:1px solid var(--line-2);transition:.13s}
.rrow:last-child{border-bottom:0}
.rrow:hover{background:var(--surface-2)}
.rrow.head{background:var(--surface-2);padding:11px 20px}
.rrow.head span{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.rrow .per{font-weight:600;font-size:13px}
.rrow .per .mono{font-size:10px;color:var(--muted);font-weight:500;display:block;margin-top:2px}
.rrow .num{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:13.5px;text-align:right;font-variant-numeric:tabular-nums}
.rrow .num small{font-size:10px;color:var(--muted);font-weight:500}
.r-actions{display:flex;gap:6px;justify-content:flex-end}
.iconbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:.13s}
.iconbtn:hover{border-color:var(--accent);color:var(--green-ink);background:rgba(var(--accent-rgb),.07)}
.iconbtn.danger:hover{border-color:var(--red);color:var(--red);background:rgba(216,66,58,.07)}

.mini-chart{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:26px}
.mini-chart .mc-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.mini-chart .mc-head b{font-size:13.5px;font-weight:700}
.mini-chart .mc-head span{font-size:11px;color:var(--muted);font-weight:500}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:12px 18px;border-radius:10px;box-shadow:0 18px 44px -16px rgba(0,0,0,.5);z-index:90;display:flex;align-items:center;gap:10px;animation:tin .2s ease}
.toast .d{width:8px;height:8px;border-radius:50%;background:var(--green)}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}

/* ---- marketplace chips (client cards / rows) ---- */
.mk-row{display:flex;flex-wrap:wrap;gap:6px}
.mk-chip{display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.02em;padding:4px 9px 4px 8px;border-radius:7px}
.mk-chip .d{width:6px;height:6px;border-radius:50%;flex:none}

/* ---- marketplace tabs (history) ---- */
.mk-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.mk-tab{appearance:none;cursor:pointer;display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);color:var(--muted);font-family:'Sora';font-weight:600;font-size:13px;padding:9px 14px;border-radius:var(--r-md);transition:.14s}
.mk-tab:hover{border-color:#c9cfca}
.mk-tab .d{width:8px;height:8px;border-radius:50%}
.mk-tab.on{background:#fff;font-weight:700}
.mk-tab.is-closed{opacity:.55}
.mk-tab-n{font-family:'JetBrains Mono',monospace;font-size:10px;background:var(--surface-2);color:var(--muted);padding:2px 6px;border-radius:6px;font-weight:600}

/* ---- new-client form ---- */
.form-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;box-shadow:var(--sh-1)}
.form-sec{padding:22px 24px}
.form-sec + .form-sec{border-top:1px solid var(--line)}
.form-sec-head{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;margin-bottom:18px}
.form-sec-head .mono{font-size:10px;letter-spacing:.06em;color:var(--brand-ink);background:rgba(var(--accent-rgb),.14);padding:4px 8px;border-radius:6px;font-weight:700}
.form-sec-note{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.02em;text-transform:lowercase;color:var(--muted);font-weight:500}
.form-grid{display:grid;grid-template-columns:1.4fr 1fr 1.4fr;gap:14px;align-items:end}
.lfield{display:flex;flex-direction:column;gap:7px;min-width:0}
.lf-label{font-size:12px;font-weight:600;color:var(--ink-2)}
.lf-label i{font-style:normal;color:var(--muted);font-weight:500;font-size:11px}
.lf-in{display:flex;align-items:center;background:var(--surface-2);border:1.5px solid var(--line);border-radius:var(--r-md);overflow:hidden;transition:.15s var(--ease)}
.lf-in:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px rgba(var(--accent-rgb),.12);background:#fff}
.lf-in.err{border-color:var(--red);box-shadow:0 0 0 3px rgba(216,66,58,.1)}
.lf-in input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-family:'Sora';font-size:13.5px;font-weight:500;color:var(--ink);padding:11px 13px}
.lf-in input.mono{font-family:'JetBrains Mono',monospace;font-size:12.5px}
.lf-in input::placeholder{color:#9aa39d}
.lf-in .affix-r{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);padding:0 12px 0 0}
.lf-in .affix-l{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);padding:0 0 0 12px}
.lf-in.is-select{position:relative}
.lf-in.is-select select{flex:1;min-width:0;appearance:none;border:0;outline:none;background:transparent;font-family:'Sora';font-size:13.5px;font-weight:500;color:var(--ink);padding:11px 13px;cursor:pointer}
.lf-in.is-select select:disabled{color:var(--muted);cursor:not-allowed}
.lf-in .sel-caret{position:absolute;right:12px;pointer-events:none;color:var(--muted);font-size:11px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:4px;gap:4px}
.seg button{flex:1;appearance:none;border:0;cursor:pointer;background:none;padding:8px 6px;border-radius:9px;font-family:'Sora';font-weight:600;font-size:12.5px;color:var(--muted);transition:.13s var(--ease)}
.seg button.on{background:var(--grad-cta);color:#fff;box-shadow:0 6px 14px -8px rgba(16,163,74,.7)}
.mk-card{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--surface-2)}
.mk-card-top{display:flex;gap:10px;align-items:center;margin-bottom:13px}
.mk-pick{flex:1 1 220px;min-width:0}
.mk-acct-id{flex:1 1 200px;min-width:0}
.mk-metas{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mk-lifecycle{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.mk-lifecycle.is-closed{opacity:.85}
.mk-lifecycle input[type=date]{font-family:'JetBrains Mono',monospace;font-size:12.5px}
.meta-field{display:flex;flex-direction:column;gap:6px;min-width:0}
.mf-label{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.meta-field .lf-in input{padding:9px 10px;text-align:right}
.add-mk{appearance:none;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border:1px dashed #c4cbc4;background:transparent;color:var(--brand-ink);font-family:'Sora';font-weight:600;font-size:13px;padding:11px;border-radius:var(--r-md);margin-top:4px;transition:.14s var(--ease)}
.add-mk:hover{border-color:var(--brand);background:rgba(var(--accent-rgb),.05)}
.add-mk:disabled{opacity:.4;cursor:not-allowed}
.form-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.sched-grid{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}
.wd-row{display:flex;gap:6px;flex-wrap:wrap}
.wd-chip{appearance:none;cursor:pointer;min-width:46px;border:1px solid var(--line);background:#fff;color:var(--muted);font-family:'Sora';font-weight:600;font-size:12px;padding:10px 8px;border-radius:10px;transition:.13s var(--ease)}
.wd-chip:hover{border-color:#c9cfca;color:var(--ink)}
.wd-chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.sched-preview{display:inline-flex;align-items:center;gap:9px;margin-top:16px;background:rgba(var(--accent-rgb),.1);color:var(--brand-ink);border:1px solid rgba(var(--accent-rgb),.3);padding:10px 15px;border-radius:var(--r-md);font-size:13px;font-weight:600}
.cc-sched{display:inline-flex;align-items:center;gap:6px;margin-top:9px;font-size:11px;font-weight:600;color:var(--muted);background:var(--surface-2);padding:5px 10px 5px 8px;border-radius:8px}
.cc-sched svg{flex:none;color:var(--brand-ink)}

@media (max-width:720px){
  .ch-actions{width:100%}
  .ch-actions .btn-accent{flex:1;justify-content:center}
  .search{max-width:none}
  .page-inner{padding:20px 16px 48px}
  /* alvos de toque >=44px */
  .chip,.due-toggle,.mk-tab,.wd-chip,.rep-connect,.an-btn,.an-opt{min-height:44px}
  .km-btn,.icon-btn,.iconbtn{width:44px;height:44px}
  /* fonte 16px evita o auto-zoom do iOS ao focar inputs */
  .search input,.filter-select select,.due-date input,.lf-in input,.lf-in select,.mk-lifecycle input,.meta-field .lf-in input{font-size:16px}
  .form-grid{grid-template-columns:1fr}
  .mk-metas{grid-template-columns:1fr 1fr}
  .mk-card-top{flex-wrap:wrap}
  .kpis{grid-template-columns:1fr 1fr}
  .rrow,.rrow.head{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,.8fr) 150px}
  .rrow .col-hide{display:none}
  .tb-user .who{display:none}
}

/* reduced-motion: bloco por último no cascade p/ vencer as regras :hover/animation
   equivalentes em especificidade definidas acima (mesma especificidade + ordem de
   origem posterior venceria senão, anulando esta seção) */
@media (prefers-reduced-motion: reduce){
  .la-blob,.la-top img{animation:none}
  .la-top,.la-tag,.la-head,.la-feats li,.la-foot,.login-card,.login-err{animation:none}
  .rep .sk{animation:none}
  .km-menu,.toast{animation:none}
  .aurora::before,.aurora::after{animation:none}
  .ccard:hover,.kpi:hover,.btn-accent:hover,.btn-primary:hover,.set-acc:hover{transform:none}
}

/* ── Faturômetro ─────────────────────────────────────────────────────────── */
.fat-hero{background:linear-gradient(160deg,var(--brand) 0%,var(--brand-strong) 100%);border-radius:20px;padding:26px 20px 34px;text-align:center;color:#fff;margin-bottom:-26px}
.fat-hero h1{font-size:clamp(20px,3vw,30px);font-weight:800;letter-spacing:-.02em;margin-bottom:12px}
.fat-pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.9);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.fat-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.fat-dot-off{background:var(--amber)}
.fat-hero-card{background:#fff;border-radius:18px;box-shadow:0 12px 32px rgba(14,26,19,.14);max-width:620px;margin:16px auto 0;padding:26px 20px}
.fat-big{font-size:clamp(34px,7vw,64px);font-weight:800;letter-spacing:-.03em;color:var(--ink);font-variant-numeric:tabular-nums;transition:color .25s var(--ease),transform .25s var(--ease)}
.fat-big-mudou{color:var(--brand-ink);transform:scale(1.02)}
.fat-big-load{font-size:22px;color:var(--muted);font-weight:600}
.fat-hero-sub{margin-top:6px;font-size:13px;color:var(--ink-2);font-weight:600}
.fat-erro{margin-top:10px;font-size:12px;font-weight:600;color:var(--red-ink);background:rgba(229,72,77,.08);border:1px solid rgba(229,72,77,.35);border-radius:10px;padding:8px 12px}
.fat-contexto{display:flex;flex-wrap:wrap;align-items:center;gap:14px;justify-content:center;margin:34px 0 16px;font-size:12.5px;color:var(--ink-2);font-weight:600}
.fat-alerta{color:var(--amber-ink);text-decoration:none;border-bottom:1px dashed currentColor}
.fat-var{font-weight:700;font-size:13px}
.fat-var-up{color:var(--green-ink)} .fat-var-down{color:var(--red-ink)} .fat-var-nd{color:var(--muted)}
.fat-grid{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:18px}
@media (max-width:860px){.fat-grid{grid-template-columns:1fr}}
.fat-metricas{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:14px}
.fat-metrica{background:#fff;padding:14px 12px;text-align:center;display:flex;flex-direction:column;gap:5px}
.fat-metrica-lbl{font-size:11px;color:var(--muted);font-weight:600}
.fat-metrica-val{font-size:19px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.fat-tab{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
.fat-tab th{text-align:right;font-size:11px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.fat-tab th:first-child{text-align:left}
.fat-tab td{padding:10px;border-bottom:1px solid var(--line-2);text-align:right;font-variant-numeric:tabular-nums}
.fat-tab td:first-child{text-align:left;font-weight:600}
.fat-tab tr.fat-zerado td{color:var(--muted);font-weight:500}
.fat-tab tbody tr{cursor:pointer}
.fat-tab tbody tr:hover{background:var(--surface-2)}
.fat-chip{display:inline-block;margin-left:8px;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;background:rgba(245,158,11,.14);color:var(--amber-ink)}
.fat-chip-neutro{background:var(--surface-2);color:var(--muted)}
.fat-backfill{margin-top:16px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:12.5px;color:var(--ink-2);font-weight:600}
.fat-backfill-bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:8px}
.fat-backfill-bar > div{height:100%;background:var(--brand);transition:width .4s var(--ease)}
</style>
